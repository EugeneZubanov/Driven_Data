name: Quiet Night APK

on:
  push:
    paths: ["SnoreTracker/**", ".github/workflows/quiet-night.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnoreTracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: QuietNight-apk
          path: SnoreTracker/app/build/outputs/apk/release/app-release.apk
